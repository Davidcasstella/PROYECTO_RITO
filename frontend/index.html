<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RITO Rooftop · Gastrobar &amp; Terraza en Sogamoso</title>
    <meta
      name="description"
      content="RITO Rooftop, gastrobar y terraza en Sogamoso: cócteles de autor, cortes, vinos y atardeceres sobre la plaza. Reserva tu mesa por WhatsApp."
    />
    <meta name="theme-color" content="#0b0a08" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://proyecto-rito.vercel.app/" />

    <!-- Open Graph: cómo se ve el enlace al compartirlo en WhatsApp, Facebook o Instagram. -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="RITO Rooftop" />
    <meta property="og:title" content="RITO Rooftop · Gastrobar &amp; Terraza" />
    <meta
      property="og:description"
      content="Cócteles únicos, buena vibra y atardeceres mágicos en Sogamoso."
    />
    <meta property="og:url" content="https://proyecto-rito.vercel.app/" />
    <meta property="og:image" content="https://proyecto-rito.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="La plaza de Sogamoso vista desde la terraza de RITO, con palmeras y el sol en lo alto."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RITO Rooftop · Gastrobar &amp; Terraza" />
    <meta
      name="twitter:description"
      content="Cócteles únicos, buena vibra y atardeceres mágicos en Sogamoso."
    />
    <meta name="twitter:image" content="https://proyecto-rito.vercel.app/og.jpg" />

    <!-- Datos estructurados: ayudan a Google a mostrar dirección y horario. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BarOrPub",
        "name": "RITO Rooftop",
        "description": "Gastrobar y terraza en Sogamoso: cócteles, cortes y vinos.",
        "image": "https://proyecto-rito.vercel.app/og.jpg",
        "telephone": "+57 320 397 3011",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Cra. 10 #12-14",
          "addressLocality": "Sogamoso",
          "addressRegion": "Boyacá",
          "addressCountry": "CO"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 5.7151016, "longitude": -72.9269093 },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "12:00",
            "closes": "23:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Friday", "Saturday"],
            "opens": "12:00",
            "closes": "02:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Sunday",
            "opens": "12:00",
            "closes": "22:00"
          }
        ],
        "acceptsReservations": "True",
        "sameAs": ["https://www.instagram.com/ritorooftop/"]
      }
    </script>

    <!-- La portada se ve antes: se pide la foto mientras aún se descarga el JavaScript. -->
    <link
      rel="preload"
      as="image"
      href="/images/vista-sol-sm.webp"
      media="(max-width: 700px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/vista-sol.webp"
      media="(min-width: 701px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Esta web necesita JavaScript. Para reservar escríbenos por WhatsApp al 320 397 3011.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
